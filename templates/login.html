{% extends 'layout.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
  <h1>Вход в читальный зал</h1>
  {% if enabled %}
    {% if invalid %}<p class="error" role="alert">Проверь имя и пароль.</p>{% endif %}
    <form method="post">
      <input type="hidden" name="token" value="{{ session.form_token }}">
      <label>Имя читателя <input name="username" required autocomplete="username"></label>
      <label>Пароль <input name="password" type="password" required autocomplete="current-password"></label>
      <button>Войти</button>
    </form>
  {% else %}
    <p>Для входа нужно задать переменные из README.</p>
  {% endif %}
{% endblock %}
